<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folke. - Classic Hoodie</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="detailproduk.html" class="logo">
            <img src="icon/logo.png" alt="Folke Logo" style="height: 35px;">
        </a>
        
        <nav class="nav-links">
            <a href="detailproduk.html" class="active">Home</a>
            <a href="#">About Us</a>
        </nav>
        
        <div class="header-actions">
            <button class="btn btn-outline">Sign in</button>
            <button class="btn btn-dark">Register</button>
            <div class="cart-icon-wrapper">
                <img src="icon/Ellipse 1.png" alt="Notif" class="cart-dot-svg">
                <a href="cart.html" class="btn btn-outline">Cart</a>
            </div>
        </div>
    </header>

    <main class="product-container">
        <section class="gallery-section">
            <div class="main-image-wrapper">
                <img src="icon/weui_arrow-filled.png" alt="Prev" class="arrow prev-arrow">
                <img src="img/Rectangle 14.png" alt="Classic Hoodie Main" class="main-image">
                <img src="icon/weui_arrow-filled.png" alt="Next" class="arrow next-arrow">
            </div>
            
            <div class="thumbnails">
                <img src="img/Rectangle 15.png" alt="Thumb 1" class="thumb active">
                <img src="img/Rectangle 16.png" alt="Thumb 2" class="thumb">
                <img src="img/Rectangle 17.png" alt="Thumb 3" class="thumb">
                <img src="img/Rectangle 18.png" alt="Thumb 4" class="thumb">
            </div>
        </section>

        <section class="details-section">
            <h1 class="product-title">Classic hoodie</h1>
            
            <div class="price-row">
                <span class="price">$85,00</span>
                <button class="btn-add-cart">
                    Add to cart
                    <img src="icon/Vector.png" alt="Cart Icon" class="cart-btn-icon">
                </button>
            </div>

            <div class="info-block">
                <h3 class="info-title">Product description</h3>
                <p class="info-text">
                    A clean, everyday hoodie designed for comfort and effortless style. 
                    Crafted with a soft cotton blend and a relaxed silhouette, this hoodie offers 
                    warmth without feeling heavy.
                </p>
            </div>

            <div class="info-block">
                <h3 class="info-title">Material</h3>
                <ul class="info-list">
                    <li>80% Cotton</li>
                    <li>20% Polyester</li>
                </ul>
            </div>

            <div class="info-block">
                <h3 class="info-title">Variant</h3>
                <div class="variant-options">
                    <button class="variant-btn" style="background-color: #8f292b;">Red</button>
                    <button class="variant-btn" style="background-color: #222222;">Black</button>
                    <button class="variant-btn" style="background-color: #e0e0e0; color: #222;">White</button>
                    <button class="variant-btn" style="background-color: #6a4f44;">Brown</button>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
